name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        agent-frameworks: [without, with]
        pdfium: ["5"]
        mcp: [latest]
        include:
          # one leg holds the 4.x insurance line
          - python-version: "3.10"
            agent-frameworks: with
            pdfium: "4"
            mcp: latest
          # one leg holds the declared mcp floor: the local MCP server's
          # 1.x registration path never runs on the latest release
          - python-version: "3.10"
            agent-frameworks: without
            pdfium: "5"
            mcp: "1.19.0"
    name: py${{ matrix.python-version }} (${{ matrix.agent-frameworks }} frameworks, pdfium ${{ matrix.pdfium }}, mcp ${{ matrix.mcp }})
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pip install --no-deps -e .
      - if: matrix.agent-frameworks == 'without'
        # requirements.txt carries it; this leg tests the no-framework paths
        run: pip uninstall -y openai-agents
      - if: matrix.agent-frameworks == 'with'
        run: pip install openai-agents claude-agent-sdk anthropic
      - if: matrix.pdfium == '4'
        run: pip install "pypdfium2<5"
      - if: matrix.mcp != 'latest'
        run: pip install "mcp==${{ matrix.mcp }}"
      - run: python -m pytest -q
        env:
          PAGEINDEX_API_KEY: ${{ secrets.PAGEINDEX_API_KEY }}

  gate:
    needs: tests
    # always(), because GitHub counts a SKIPPED required check as
    # passing: skipping on cancel would green-light a commit with zero
    # legs run. A cancelled run must go red here, not vanish.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.tests.result }}" = "success"
