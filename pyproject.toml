[tool.poetry]
name = "pageindex"
version = "0.2.10"
description = "Python SDK for PageIndex — reasoning-based, vectorless document retrieval, cloud and local"
readme = "README.md"
license = "MIT"
authors = ["Ray <ray@vectify.ai>"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["rag", "document", "retrieval", "llm", "pageindex", "vectorless"]
packages = [{ include = "pageindex" }]
include = [
    { path = "pageindex/config.yaml", format = ["sdist", "wheel"] },
    { path = "pageindex/flash/data/*.json", format = ["sdist", "wheel"] },
]
exclude = ["pageindex/flash/assets"]

[tool.poetry.dependencies]
python = ">=3.7"
requests = ">=2.28.0"
openai = ">=1.70.0"
litellm = ">=1.84.0"
PyPDF2 = ">=3.0.0"
pypdfium2 = ">=4.30.0"
sortedcontainers = ">=2.4.0"
regex = ">=2024.0.0"
python-dotenv = ">=1.0.0"
pyyaml = ">=6.0"
claude-agent-sdk = { version = ">=0.1.0", optional = true }
# 0.8.0 offloads sync tools to a thread; older versions run them inline and
# a blocking bridge call would freeze the agent event loop.
openai-agents = { version = ">=0.8.0", optional = true }
# messages() and as_anthropic_tools() need the SDK's beta tool runner;
# 0.68.0 is the first release with tool_runner(stream/system/max_iterations)
# and beta_tool(input_schema).
anthropic = { version = ">=0.68.0", optional = true }

[tool.poetry.extras]
claude = ["claude-agent-sdk"]
openai = ["openai-agents"]
anthropic = ["anthropic"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"

[tool.poetry.urls]
Repository = "https://github.com/VectifyAI/PageIndex"
Homepage = "https://pageindex.ai"
Documentation = "https://docs.pageindex.ai"
Issues = "https://github.com/VectifyAI/PageIndex/issues"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
