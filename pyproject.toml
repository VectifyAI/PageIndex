[project]
name = "pageindex"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "litellm==1.83.0",
    "openai-agents>=0.17.2",
    "pymupdf==1.26.4",
    "pypdf2==3.0.1",
    "pytest>=9.0.3",
    "python-dotenv==1.1.0",
    "pyyaml==6.0.2",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
pifs = "pageindex.filesystem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pageindex"]
